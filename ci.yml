name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format (Black)
        run: black --check .
      - name: Type check (mypy, advisory)
        run: mypy src
        continue-on-error: true
      - name: Tests
        run: pytest -q --cov=sfc_modeling --cov-report=term-missing
      - name: Accounting identities and benchmark solutions
        run: python examples/validate_examples.py

  dashboard-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with dashboard extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dashboard]"
      - name: Byte-compile dashboard and import visualisation code
        run: |
          python -m compileall -q app.py pages src
          python -c "import plotly.graph_objects, streamlit; import sfc_modeling.dashboard.state, sfc_modeling.visualization"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfc-modeling"
version = "0.1.0"
description = "Stock-flow consistent macroeconomic modelling: accounting engine, solver, simulation, networks and dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SFC-Modeling contributors" }]
keywords = ["macroeconomics", "stock-flow consistent", "SFC", "post-Keynesian", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "sympy>=1.12",
    "networkx>=3.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "pytest-cov>=5", "black>=24", "ruff>=0.5", "mypy>=1.10", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731", "E741"]  # line length is Black's job

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
